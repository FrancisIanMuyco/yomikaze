<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga / Manhua Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 900px;
    }
    .header h1 { font-size: 1.2rem; font-weight: 500; opacity: 0.9; }
    .header p { font-size: 0.85rem; opacity: 0.5; margin-top: 4px; }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 900px;
    }
    .controls input[type="file"] {
      background: #1a1a1a;
      color: #e0e0e0;
      border: 1px solid #333;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .controls button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .controls button:hover { background: #1d4ed8; }
    .viewer {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .page {
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }
    .page img {
      max-width: 100%;
      height: auto;
      display: block;
      referrerpolicy: no-referrer;
    }
    .page .error {
      padding: 40px;
      text-align: center;
      color: #ef4444;
      font-size: 0.9rem;
    }
    .loading {
      text-align: center;
      padding: 40px;
      opacity: 0.5;
    }
    .nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .nav:hover { background: rgba(0,0,0,0.8); }
    .nav.prev { left: 20px; }
    .nav.next { right: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="title">Select a chapter JSON to view</h1>
    <p id="meta"></p>
  </div>

  <div class="controls">
    <input type="file" id="fileInput" accept=".json">
    <button onclick="document.getElementById('fileInput').click()">Open Chapter JSON</button>
  </div>

  <div class="loading" id="loading">No chapter loaded</div>
  <div class="viewer" id="viewer"></div>

  <button class="nav prev" id="prevBtn" onclick="scrollPage(-1)">&#10094;</button>
  <button class="nav next" id="nextBtn" onclick="scrollPage(1)">&#10095;</button>

  <script>
    let currentPages = [];
    let currentIndex = 0;

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      try {
        const data = JSON.parse(text);
        renderChapter(data);
      } catch (err) {
        alert('Invalid JSON file');
      }
    });

    async function loadFromPath(path) {
      try {
        const res = await fetch(path);
        const data = await res.json();
        renderChapter(data);
      } catch (err) {
        console.error('Failed to load chapter:', err);
      }
    }

    function renderChapter(data) {
      currentPages = data.pages || [];
      currentIndex = 0;
      document.getElementById('title').textContent = `${data.manga_title || 'Manga'} — ${data.chapter_title || 'Chapter'}`;
      document.getElementById('meta').textContent = `${currentPages.length} pages`;
      document.getElementById('loading').style.display = 'none';

      const viewer = document.getElementById('viewer');
      viewer.innerHTML = '';

      currentPages.forEach((url, i) => {
        const div = document.createElement('div');
        div.className = 'page';
        div.id = `page-${i}`;

        const img = document.createElement('img');
        img.src = url;
        img.referrerPolicy = 'no-referrer';
        img.loading = 'lazy';
        img.alt = `Page ${i + 1}`;

        img.onerror = () => {
          div.innerHTML = `<div class="error">Failed to load page ${i + 1}<br><small>${url}</small></div>`;
        };

        div.appendChild(img);
        viewer.appendChild(div);
      });

      document.getElementById('prevBtn').style.display = 'flex';
      document.getElementById('nextBtn').style.display = 'flex';
    }

    function scrollPage(dir) {
      const pages = document.querySelectorAll('.page');
      if (!pages.length) return;
      currentIndex = Math.max(0, Math.min(pages.length - 1, currentIndex + dir));
      pages[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') scrollPage(-1);
      if (e.key === 'ArrowRight') scrollPage(1);
    });

    // Auto-load if path is in query string: viewer.html?file=./manga_data/.../ch.json
    const params = new URLSearchParams(window.location.search);
    const fileParam = params.get('file');
    if (fileParam) loadFromPath(fileParam);
  </script>
</body>
</html>

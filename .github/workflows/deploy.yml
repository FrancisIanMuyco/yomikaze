name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allows only one deployment at a time; gives GITHUB_TOKEN Pages permissions.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # GitHub Pages serves from /yomikaze/ — set the Vite base path accordingly.
        #
        # Optional proxy env vars (set as repo Actions secrets) for networks
        # that block MangaDex directly:
        #   VITE_MANGADEX_ENDPOINT      https://<worker>.workers.dev/md
        #   VITE_MANGADEX_COVER_ENDPOINT https://<worker>.workers.dev/covers
        run: |
          VITE_BASE_PATH=/yomikaze/ \
          VITE_MANGADEX_ENDPOINT="${{ secrets.VITE_MANGADEX_ENDPOINT }}" \
          VITE_MANGADEX_COVER_ENDPOINT="${{ secrets.VITE_MANGADEX_COVER_ENDPOINT }}" \
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
